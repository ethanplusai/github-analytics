<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Analytics</title>
<meta name="description" content="Persistent GitHub traffic analytics — clones, views, referrers and paths kept past GitHub's 14-day window.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
  // Applied before first paint so a chosen theme never flashes the other one.
  try {
    var t = localStorage.getItem('gha-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#app-root">Skip to content</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/" aria-label="GitHub Analytics home">
      <svg class="brand__mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1"  y="9"  width="3" height="8" rx="1.2"></rect>
        <rect x="6"  y="5"  width="3" height="12" rx="1.2"></rect>
        <rect x="11" y="1"  width="3" height="16" rx="1.2"></rect>
      </svg>
      <span class="brand__name">GitHub Analytics</span>
    </a>
    <div class="topbar__actions">
      <span id="poll-status" class="pill" role="status" aria-live="polite">Loading…</span>
      <button id="refresh-btn" class="btn btn--ghost" type="button" title="Poll GitHub now">Refresh</button>
      <button id="theme-btn" class="btn btn--icon" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7z" fill="currentColor"></path></svg>
      </button>
    </div>
  </div>
</header>

<div id="notices" class="notices" aria-live="polite"></div>

<main id="app-root" class="app" tabindex="-1"></main>

<footer class="footer">
  <div class="footer__inner">
    <span id="footer-note">Traffic data is collected from the GitHub REST API and kept indefinitely.</span>
  </div>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
